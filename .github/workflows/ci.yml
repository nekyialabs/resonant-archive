name: CI

# Actions are pinned to the commit their tag pointed at on 2026-10-16 (the tag is in the comment). To update one:
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (dereference an annotated tag with git/tags/<sha>), read what
# changed, then replace the sha. The service image below is pinned by digest the same way. The Claude Code release in
# the mod job is pinned by version number only (npm resolves it; that is a version pin, not a digest).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The role tests create LOGIN roles without passwords, as on the trust-auth local cluster. Throwaway server.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # An admin DSN: each test creates and drops its own throwaway database on this server.
      RESONANT_ARCHIVE_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests (the real-model tests are marked slow and skipped)
        run: python -m pytest -q -m "not slow"

  package:
    name: wheel contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Check that the migrations and the bundled docker files are inside it
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["resonant_archive/migrations/0001_init.sql",
                  "resonant_archive/migrations/0002_importer.sql",
                  "resonant_archive/migrations/0003_unit_key.sql",
                  "resonant_archive/data/docker-compose.yml",
                  "resonant_archive/data/init-extensions.sql"]
          missing = [n for n in need if n not in names]
          assert not missing, f"missing from the wheel: {missing}"
          print("wheel ok:", len(names), "files")
          PY

  private-strip-lint:
    name: private-strip lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Lint (public defaults, plus your private terms when the PRIVATE_STRIP_TERMS repository secret is set)
        env:
          PRIVATE_STRIP_TERMS: ${{ secrets.PRIVATE_STRIP_TERMS }}
        run: |
          if [ -n "$PRIVATE_STRIP_TERMS" ]; then
            printf '%s\n' "$PRIVATE_STRIP_TERMS" > "$RUNNER_TEMP/terms.txt"
            export PRIVATE_STRIP_TERMS_FILE="$RUNNER_TEMP/terms.txt"
          fi
          python scripts/private_strip_lint.py

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The gitleaks binary (MIT), not gitleaks-action: the action wants a GITLEAKS_LICENSE secret on an organization's
      # repository, and secrets never reach pull requests from forks. Pinned by version and checked against the
      # release's own sha256 (v8.30.1, 2026-03-21). It reads .gitleaks.toml from the repository root.
      - name: Scan the whole history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  claude-code-mod:
    name: Claude Code mod (claude-code/chronicle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Is the mod in this checkout?
        id: mod
        run: |
          if [ -d claude-code/chronicle ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::claude-code/chronicle is not in this checkout; skipping"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.mod.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Install Claude Code
        if: steps.mod.outputs.present == 'true'
        # Pinned to a release that was at least three days old when chosen (2.1.296, 2026-10-09), and the one the
        # mod's tests were last run against. Bump deliberately; do not install a release newer than three days.
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Lint
        if: steps.mod.outputs.present == 'true'
        working-directory: claude-code/chronicle
        run: ./scripts/lint.sh
      - name: Validate the plugin
        if: steps.mod.outputs.present == 'true'
        working-directory: claude-code/chronicle
        run: claude plugin validate .
      - name: Tests
        if: steps.mod.outputs.present == 'true'
        working-directory: claude-code/chronicle
        run: claude plugin test .
      - name: Typecheck
        # The type declarations are written by Claude Code itself when it loads the mod in a session, so they are
        # not in a fresh checkout. Typecheck only when they are present.
        if: steps.mod.outputs.present == 'true'
        working-directory: claude-code/chronicle
        run: |
          if [ -d .claude-plugin/types ]; then npx --yes -p typescript@6.0.3 tsc --noEmit -p .
          else echo "::notice::no .claude-plugin/types here (Claude Code writes them in a session); typecheck skipped"; fi
