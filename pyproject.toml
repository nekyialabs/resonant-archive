[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resonant-archive"
version = "2.1.0"
description = "Make compaction bearable: a local, searchable archive of your AI conversations (Postgres, pgvector, local embeddings) plus a Claude Code mod for compaction."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Nekyia Labs" },
]
keywords = [
  "mcp",
  "rag",
  "chatgpt",
  "claude",
  "archive",
  "semantic-search",
  "postgres",
  "pgvector",
  "resonant",
  "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "psycopg[binary]>=3.1,<4",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "numpy>=1.26",
  "mcp>=1.2,<3",
  "python-frontmatter>=1.0.0",
  "typer>=0.12.0",
  # Windows has no system zoneinfo database: zoneinfo reads it from this package (psycopg pulls it in there too).
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.21.0",
]

[project.scripts]
resonant-archive = "resonant_archive.cli:main"

[project.urls]
Homepage = "https://nekyialabs.com"
Repository = "https://github.com/nekyialabs/resonant-archive"

[tool.setuptools.package-data]
resonant_archive = ["migrations/*.sql", "data/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["resonant_archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
